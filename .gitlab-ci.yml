# Same checks as docs/ESTANDARES.md, section 5.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

backend:
  image: python:3.12-slim
  before_script:
    - cd backend
    - pip install --no-cache-dir -r requirements-dev.txt
  script:
    - ruff check .
    - ruff format --check .
    - mypy src
    - pytest --cov=src --cov-fail-under=80

frontend:
  image: node:22
  before_script:
    - cd frontend
    - npm ci --no-audit --no-fund
  script:
    - npm run typecheck
    - npm run lint
    - npm test
