[project]
name = "evaluador"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["E402"]  # adds src/ to the path before importing
"tests/**" = ["S105", "S106", "S603", "S607", "E702", "E501"]  # datos ficticios y tablas compactas

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["openpyxl.*", "pdfplumber.*", "pypdfium2.*"]
ignore_missing_imports = true
