# Producción (servidor con nginx en el host que termina TLS y PostgreSQL del host):
#   docker compose -p crm-relay -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Las variables salen de .env (ver .env.example y deploy/README.md).
services:
  db:
    # En producción NO se levanta el Postgres del compose: se usa el PostgreSQL del host, en su propia base
    # (crm_relay). Se activa solo con: docker compose --profile local-db ...
    profiles: ["local-db"]
    ports: !reset []

  backend:
    depends_on: !reset null
    ports:
      - "127.0.0.1:${API_PORT:-3104}:3000"
    networks: [default, wiki]
    volumes:
      # Socket Unix de PostgreSQL: sin abrir puertos ni red. pg_hba.conf solo permite al rol crm_relay
      # entrar a la base crm_relay por este socket (ver deploy/db-setup.sh).
      - /var/run/postgresql:/var/run/postgresql
    environment:
      DB_HOST: /var/run/postgresql
      DB_PORT: "5432"
      DB_USER: ${CRM_DB_USER:-crm_relay}
      DB_PASS: ${CRM_DB_PASSWORD:?Ejecuta deploy/db-setup.sh (define CRM_DB_PASSWORD en .env)}
      DB_NAME: ${CRM_DB_NAME:-crm_relay}
      # Frontend y API públicos; el backend acepta peticiones del navegador desde ambos orígenes.
      CORS_ORIGIN: ${WEB_ORIGIN:?Define WEB_ORIGIN en .env},${API_ORIGIN:?Define API_ORIGIN en .env}
      # Webhook de Meta: <API_ORIGIN>/whatsapp/webhook
      PUBLIC_URL: ${API_ORIGIN}
      # Imágenes del catálogo en MinIO (bucket y credenciales propios). Sin MINIO_ENDPOINT usa el volumen local.
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_BUCKET: ${MINIO_BUCKET:-relay-media}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}

  frontend:
    ports: !override
      - "127.0.0.1:${WEB_PORT:-3103}:80"

networks:
  # Red del stack de la wiki, donde vive MinIO (alias `minio`). Solo el backend se une a ella.
  wiki:
    name: ${WIKI_NETWORK:-exmachina-wiki_default}
    external: true
