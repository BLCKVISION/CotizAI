server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Detrás del nginx del host (que pone la IP real en X-Forwarded-For) solo se confía en redes privadas/Docker.
  # Así el backend ve la IP real del cliente (límite de intentos) y no se puede falsear con cabeceras propias.
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from 127.0.0.1;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Tiempo real (Socket.IO): requiere Upgrade a WebSocket y conexiones largas.
  # ^~ : las rutas /api/ tienen prioridad sobre las reglas por extensión (si no, /api/media/*.webp se serviría como archivo estático)
  location ^~ /api/socket.io/ {
    proxy_pass http://backend:3000/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  # La API vive detrás de /api (el prefijo se quita al reenviar). Las cabeceras de seguridad las pone el backend (helmet).
  location ^~ /api/ {
    proxy_pass http://backend:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
    client_max_body_size 8m; # subida de imágenes del catálogo (máx. 5 MB + multipart)
  }

  # Archivos con hash en el nombre (los genera Angular): caché de un año.
  location ~* \.(?:js|css|woff2?)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  # Iconos e imágenes de marca (nombre fijo, sin hash): caché corta para que un cambio de logo/favicon llegue a todos.
  location ~* \.(?:svg|png|ico|webp)$ {
    add_header Cache-Control "public, max-age=3600, must-revalidate";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  # SPA: cualquier ruta del cliente devuelve index.html
  location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }
}
