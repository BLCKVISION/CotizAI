<!doctype html>
<html lang="es" class="theme-light">
<head>
  <meta charset="utf-8">
  <base href="/">
  <title>Relay — WhatsApp CRM con IA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Relay: plataforma CRM de WhatsApp con agente IA, pipeline de ventas y automatización para negocios en Venezuela">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2">
  <link rel="icon" href="favicon.ico?v=2" sizes="any">
  <link rel="shortcut icon" href="favicon.ico?v=2">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <meta name="theme-color" content="#ffffff">
  <script>
    (function() {
      try {
        var theme = localStorage.getItem('relay_theme_mode') || 'light';
        document.documentElement.classList.remove('theme-dark', 'theme-light');
        document.documentElement.classList.add('theme-' + theme);
      } catch (e) {
        document.documentElement.classList.add('theme-light');
      }
    })();
  </script>
</head>
<body class="theme-light">
  <div class="ambient-glow-bottom-left" aria-hidden="true"></div>
  <div class="ambient-glow-top-right" aria-hidden="true"></div>
  <div class="ambient-glow-center" aria-hidden="true"></div>
  <app-root></app-root>
</body>
</html>
