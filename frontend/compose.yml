# Frontend aislado: servidor de desarrollo de Expo (web). La API se espera en localhost:8000.
name: evaluador-frontend
services:
  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npx expo start --web --port 8081"
    environment:
      EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://localhost:8000}
      CI: "1"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports: ["127.0.0.1:8081:8081"]
volumes:
  node_modules:
