# API (FastAPI en 127.0.0.1:18001). TLS: certbot --nginx -d api-hackathon.exmachina.systems
upstream hackathon_api {
    server 127.0.0.1:18001;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name api-hackathon.exmachina.systems;

    server_tokens off;
    client_max_body_size 11m;         # documentos de hasta 10 MB; la API limita el JSON a 1 MiB
    client_body_timeout 15s;

    # Solo se expone el prefijo de la API; todo lo demás (docs, openapi) no existe de cara al público.
    location = /api/v1/sesiones {
        limit_req zone=hackathon_login burst=5 nodelay;   # defensa extra contra fuerza bruta (además del bloqueo en la app)
        include /etc/nginx/snippets/hackathon-proxy.conf;
    }

    location = /api/v1/transcriptions {
        client_max_body_size 11m;     # fotos de hasta 10 MB; la API aplica el límite exacto
        limit_req zone=hackathon_api burst=10 nodelay;
        include /etc/nginx/snippets/hackathon-proxy.conf;
    }

    location /api/v1/ {
        limit_req zone=hackathon_api burst=40 nodelay;
        include /etc/nginx/snippets/hackathon-proxy.conf;
    }

    location / { return 404; }
}
