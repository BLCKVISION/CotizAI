proxy_pass http://hackathon_api;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# SOBRESCRIBE (no añade): la API toma la IP del primer valor y un cliente podría falsificarlo con $proxy_add_x_forwarded_for.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 300s;  # evaluar un proyecto con IA puede tardar varios minutos
