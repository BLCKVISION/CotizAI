# Cabeceras de seguridad del frontend. Se incluye en CADA location porque nginx no hereda add_header
# cuando un location define el suyo.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self'; connect-src 'self' https://api-hackathon.exmachina.systems; frame-ancestors 'none'" always;
