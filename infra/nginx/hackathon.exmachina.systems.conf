# Frontend (Expo web exportado, estático). Sirve hackathon.exmachina.systems y cotiz-ai.exmachina.systems.
# TLS: tras crear el DNS, ejecutar  ./infra/deploy.sh tls  (certbot añade el bloque 443 y la redirección).
server {
    listen 80;
    listen [::]:80;
    server_name hackathon.exmachina.systems cotiz-ai.exmachina.systems;

    root /var/www/hackathon;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Activos con hash en el nombre: caché larga.
    location /_expo/ {
        include /etc/nginx/snippets/hackathon-seguridad.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA: cualquier ruta cae en index.html
    location / {
        include /etc/nginx/snippets/hackathon-seguridad.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. { deny all; }
}
