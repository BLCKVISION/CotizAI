sonar.projectKey=cotizai
sonar.sources=.
sonar.tests=backend/tests,frontend/tests
sonar.exclusions=**/coverage.xml,backend/tests/**,frontend/tests/**,design-system/**,muestras/**,**/node_modules/**
sonar.python.version=3.12
sonar.python.coverage.reportPaths=backend/coverage.xml
